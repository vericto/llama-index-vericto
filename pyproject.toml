[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "llama-index-tools-vericto"
dynamic = ["version"]
description = "An integration package connecting Vericto (database guardrails for AI agents) and LlamaIndex: check every SQL statement against Vericto's rules before it runs."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11,<4.0"
authors = [{ name = "Vericto", email = "security@vericto.com" }]
maintainers = [{ name = "vericto" }]
keywords = [
    "llama-index",
    "llamaindex",
    "vericto",
    "sql",
    "guardrails",
    "database-guardrails",
    "ai-agents",
    "text-to-sql",
    "tool",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# The Vericto SDK (Apache-2.0, urllib3 only) does the evaluation: the Runtime API
# online, the `vericto` CLI's local engine offline (a separate process; the
# AGPL-3.0 engine is never imported or bundled). SQLAlchemy is already a
# dependency of llama-index-core; it is listed because the package imports it.
dependencies = [
    "llama-index-core>=0.13.0,<0.15",
    "vericto>=0.9.0,<0.10.0",
    "sqlalchemy>=1.4,<3",
]

[project.urls]
Homepage = "https://vericto.com"
Documentation = "https://github.com/vericto/llama-index-vericto#readme"
Repository = "https://github.com/vericto/llama-index-vericto"
Issues = "https://github.com/vericto/llama-index-vericto/issues"
Changelog = "https://github.com/vericto/llama-index-vericto/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
]
test_integration = []
lint = ["ruff>=0.17.3,<0.18.0"]
typing = [
    "mypy>=2.4.1,<3",
    "pytest>=9.0.3,<10.0.0",
]
dev = []

[tool.uv]
default-groups = ["test", "lint", "typing"]

[tool.hatch.version]
path = "llama_index/tools/vericto/_version.py"

[tool.hatch.build.targets.sdist]
include = [
    "llama_index/",
    "tests",
    "examples",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "NOTICE",
    "TRADEMARKS.md",
    "SECURITY.md",
]

[tool.hatch.build.targets.wheel]
# PEP 420 namespace packages: no __init__.py in llama_index/ or llama_index/tools/,
# as in every llama-index-* package.
include = ["llama_index/"]

[tool.llamahub]
contains_example = false
import_path = "llama_index.tools.vericto"

[tool.llamahub.class_authors]
VerictoToolSpec = "vericto"
VerictoSQLDatabase = "vericto"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["llama_index", "tests", "examples", "scripts"]
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
# Untyped third-party test helpers.
module = ["pytest_socket.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# BaseToolSpec and SQLDatabase subclasses: their bases carry Any.
module = ["llama_index.tools.vericto.*", "tests.*", "examples.*"]
disallow_subclassing_any = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "A",      # flake8-builtins
    "ASYNC",  # flake8-async
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "D",      # pydocstyle
    "E",      # pycodestyle error
    "EM",     # flake8-errmsg
    "F",      # pyflakes
    "FA",     # flake8-future-annotations
    "FBT",    # flake8-boolean-trap
    "I",      # isort
    "PERF",   # perflint
    "PGH",    # pygrep-hooks
    "PIE",    # flake8-pie
    "RET",    # flake8-return
    "RUF",    # ruff
    "S",      # flake8-bandit
    "SIM",    # flake8-simplify
    "T20",    # flake8-print
    "TID",    # flake8-tidy-imports
    "UP",     # pyupgrade
    "W",      # pycodestyle warning
]
ignore = [
    "RUF012",  # Doesn't play well with Pydantic
]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true

[tool.ruff.lint.isort]
# llama_index is a namespace shared with llama-index-core: only this package's
# subpackage is first-party.
known-first-party = ["llama_index.tools.vericto"]
known-third-party = ["llama_index"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = ["S101", "S603", "D", "FBT", "S608"]
"examples/*.py" = ["T201", "S608", "INP001"]
"scripts/*.py" = ["T201", "INP001"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
markers = [
    "compile: mark placeholder test used to compile integration tests without running them",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Upstream: llama-index-workflows inspects every attribute of a FunctionAgent
    # (inspect.getmembers), which touches pydantic's deprecated accessors.
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    "ignore::pydantic.warnings.PydanticDeprecatedSince211",
]
